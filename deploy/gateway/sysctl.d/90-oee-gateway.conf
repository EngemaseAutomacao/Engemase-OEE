# Política de rede do gateway OEE (docs/16 §5). Instalado em
# /usr/lib/sysctl.d/90-oee-gateway.conf; para mudar um valor, criar
# /etc/sysctl.d/90-oee-gateway.conf (mesmo nome, prevalece sobre este).
# O endurecimento do kernel (kernel.*, fs.*) fica na imagem.

# O gateway NUNCA roteia entre OT e IT.
net.ipv4.ip_forward = 0
-net.ipv6.conf.all.forwarding = 0

# IPv6 desligado no MVP (docs/16 D-g5); o nftables também descarta IPv6.
# "-" na frente: não falhar se o IPv6 não existir no kernel.
-net.ipv6.conf.all.disable_ipv6 = 1
-net.ipv6.conf.default.disable_ipv6 = 1

# Anti-spoofing: pacote só é aceito pela interface da rota de volta.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Sem redirects nem source routing.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Não responder ARP de um IP da IT pela OT, nem o contrário.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

net.ipv4.conf.all.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1
