# Diretórios e permissões do gateway OEE (docs/16 §4). Instalado em
# /usr/lib/tmpfiles.d/oee-gateway.conf; aplicado pelo postinst e em todo boot.
# NUNCA pôr idade (coluna Age) nas linhas de estado: o systemd-tmpfiles-clean
# apagaria o buffer.
#
# No R1000, /var/lib/oee-gateway é o bind de /data/oee (var-lib-oee\x2dgateway.mount,
# montado antes deste arquivo rodar no boot). Na bancada é um diretório comum.
#Tipo Caminho                                   Modo Dono    Grupo  Idade Arg
d     /var/lib/oee-gateway                      0750 oee     oee    -
# Config local: diretório legível; cada arquivo protegido no próprio modo.
d     /etc/oee-gateway                          0755 root    root   -
z     /etc/oee-gateway/gateway.yaml             0640 root    oee    -
# Gerados pelo oee-helper a partir do network.json (a única fonte da rede).
z     /etc/oee-gateway/network.json             0640 root    oee    -
z     /etc/oee-gateway/proxy.env                0640 root    oee    -
z     /etc/oee-gateway/ca-bundle.pem            0644 root    root   -
z     /etc/oee-gateway/nftables.nft             0600 root    root   -
# Sockets da CLI, da página local e do ajudante (criados pelas units .socket).
d     /run/oee-gateway                          0755 root    root   -
# Drop-in com a interface OT da página local (gerado pelo oee-helper).
d     /etc/systemd/system/oee-localui.socket.d  0755 root    root   -
# Home do técnico (console local).
d     /home/tecnico                             0750 tecnico tecnico -
