# Pacote oee-gateway-remote-access (docs/12).
#Tipo Caminho                                    Modo Dono    Grupo   Idade
# Política local do acesso remoto, criada pelo cliente ou pelo técnico (sem ela, o acesso segue a
# plataforma). Precisa ser legível pelo oee-ra: arquivo ilegível = acesso BLOQUEADO (falha
# fechada), então o tmpfiles acerta o modo se o arquivo existir.
z     /etc/oee-gateway/remote-access.json       0644 root    root    -
# Chave de host do SSH do acesso remoto (gerada no postinst; só root lê).
d     /var/lib/oee-remote-access                 0700 root    root    -
d     /var/lib/oee-remote-access/ssh             0700 root    root    -
d     /home/suporte                              0750 suporte suporte -
# Registro de I/O do sudo do suporte (só root lê).
d     /var/log/sudo-io                           0700 root    root    -
