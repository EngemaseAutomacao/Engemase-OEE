# /etc/oee-gateway/gateway.yaml — config LOCAL mínima do gateway OEE (docs/16 §4).
#
# Conffile do pacote oee-gateway (root:oee 0640): o dpkg preserva as suas
# mudanças nas atualizações. Só valem as chaves abaixo (lidas por
# gateway/internal/config/local.go); chave desconhecida é RECUSADA e o agente não
# sobe (pega erro de digitação). Depois de editar, confira com
#   sudo -u oee oee-gateway diag        (linha "config local")
# e reinicie: systemctl restart oee-gateway.
# ("oee-gateway config validate" é para a config REMOTA em JSON, não para este.)
#
# O que NÃO fica aqui:
#   - barramentos, dispositivos, tags e máquinas: vêm da nuvem (config remota);
#   - rede, proxy e CA corporativa: a única fonte é /etc/oee-gateway/network.json
#     (Fase 1: o oee-helper gera dele o proxy.env e o pacote de CAs; na Fase 0
#     o proxy.env é escrito à mão na bancada);
#   - credencial: /var/lib/oee-gateway/credentials.json (0600, dono oee).
schema: 1

cloud:
  # URL base da plataforma; o caminho /api/gateway/v1 é fixo no agente.
  # Domínio próprio dos gateways (gw.oee.engemase.com.br) depende da decisão D28.
  url: https://oee.engemase.com.br
  timeout_s: 30
  # PEM com CAs corporativas somadas às do sistema. Vazio = só as do sistema.
  # Com CA corporativa (inspeção SSL aceita por escrito pelo TI), use
  # /etc/oee-gateway/ca-bundle.pem (root 0644); na Fase 1 o oee-helper o gera
  # a partir do network.json.
  extra_ca_file: ""

# Caminhos canônicos (docs/16 §4). Só mude em bancada/desenvolvimento.
# paths:
#   state_dir: /var/lib/oee-gateway
#   credentials: /var/lib/oee-gateway/credentials.json
#   buffer: /var/lib/oee-gateway/buffer.db
#   identity: /data/identity/hw.json

hardware:
  # auto | recomputer-r1000 | generic. "auto" e "recomputer-r1000" mapeiam
  # rs485-1/2/3 para /dev/ttyAMA2/3/5 (ordem dos bornes a confirmar na bancada).
  profile: auto
  # Portas lógicas extras ou trocadas (ex.: bancada x86 com adaptador USB-RS485);
  # valem antes do mapa do perfil:
  # serial_ports:
  #   rs485-1: /dev/ttyUSB0

log:
  # debug | info | warn | error. (F2/D29: a nuvem poderá elevar por um prazo.)
  level: info
