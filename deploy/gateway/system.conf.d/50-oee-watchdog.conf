# Watchdog de hardware (docs/16 §5): o systemd (PID 1) alimenta o watchdog do
# SoC. No CM4 (bcm2835_wdt) o máximo é ~15 s; valor maior falha com
# "Invalid argument". O watchdog do RTC do R1000 NÃO é armado no MVP.
# Instalado em /usr/lib/systemd/system.conf.d/50-oee-watchdog.conf; vale no
# próximo boot (ou após "systemctl daemon-reexec").
[Manager]
RuntimeWatchdogSec=10s
# Se o desligamento/reinício travar, o hardware reinicia depois de 2 min.
RebootWatchdogSec=2min
