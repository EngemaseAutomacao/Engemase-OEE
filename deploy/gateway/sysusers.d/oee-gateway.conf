# Usuários e grupos do gateway OEE (docs/16 §4). Instalado em
# /usr/lib/sysusers.d/oee-gateway.conf e aplicado pelo postinst e em todo boot
# (systemd-sysusers). Usuários já existentes não são alterados.
# A imagem (deploy/image, /etc/sysusers.d/engemase-image.conf) declara os mesmos
# usuários com os mesmos campos: quem rodar primeiro cria, o resultado é igual.
#
#Tipo Nome       ID  GECOS                                     Home                  Shell
u     oee        -   "Engemase OEE - agente de coleta"         /var/lib/oee-gateway  /usr/sbin/nologin
# Página local (oee-localui, Fase 1). Criado já para a imagem gravar a chave TLS
# e o hash da senha local em /data/localui no factory init.
u     oee-ui     -   "Engemase OEE - pagina local"             /nonexistent          /usr/sbin/nologin
# Técnico de campo: login SÓ no console local (HDMI + teclado), sem SSH.
# Nasce com a senha bloqueada; o factory init da bancada grava o hash da senha
# local da unidade (a mesma da página local, entregue em cartão lacrado).
u     tecnico    -   "Engemase OEE - tecnico de campo"         /home/tecnico         /bin/bash
# CLI sem sudo para comandos de leitura pelo agent.sock (Fase 1: status ao
# vivo, modbus read pela fila do barramento, config show, buffer stats, logs).
g     oee-admin  -
m     tecnico    oee-admin
# Fase 0: sem o comando "logs" do agente, o técnico lê o journal direto
# (journalctl -u oee-gateway). O agente nunca registra token nem senha.
m     tecnico    systemd-journal
# Grupos de dispositivo do agente (também em SupplementaryGroups= da unit).
# "m" cria o grupo se faltar (ex.: gpio num PC amd64 de bancada).
m     oee        dialout
m     oee        gpio
m     oee        systemd-journal
# F2 (acesso remoto sob demanda, docs/12): entra com o pacote do helper da VPN.
# A imagem já o cria (engemase-image.conf); aqui fica só como referência.
#u    oee-ra     -   "Engemase OEE - acesso remoto (F2)"       /nonexistent          /usr/sbin/nologin
