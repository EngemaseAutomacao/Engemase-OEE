# Usuários do acesso remoto de manutenção (VPN sob demanda, docs/12). Pacote
# oee-gateway-remote-access: /usr/lib/sysusers.d/oee-remote-access.conf.
# A imagem (deploy/image, /etc/sysusers.d/engemase-image.conf) declara o oee-ra com os mesmos
# campos: quem rodar primeiro cria, o resultado é igual.
#
#Tipo Nome       ID  GECOS                                     Home                  Shell
# Programa da VPN: sem grupos extras (não lê o journal, a config do agente nem os dispositivos).
u     oee-ra     -   "Engemase OEE - acesso remoto (F2)"       /nonexistent          /usr/sbin/nologin
# Técnico da Engemase pela VPN: senha bloqueada; entra só por certificado SSH da sessão aprovada
# (sshd do pacote). Lê o journal e usa a CLI de leitura; root pelo sudo, com registro de I/O.
u     suporte    -   "Engemase OEE - suporte remoto"           /home/suporte         /bin/bash
m     suporte    systemd-journal
m     suporte    oee-admin
