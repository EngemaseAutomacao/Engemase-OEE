# Limites do journal no gateway OEE (docs/16 §2: logs com limites; §7).
# Instalado em /usr/lib/systemd/journald.conf.d/50-oee-gateway.conf.
# No R1000, /var/log/journal fica na partição /data (bind feito pela imagem).
# Vale após reiniciar o systemd-journald (ou no próximo boot).
[Journal]
Storage=persistent
Compress=yes
# Disco: no máximo 256 MB de journal, mantendo 1 GB livre e 30 dias.
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
MaxRetentionSec=30day
# Antes de ir para o disco (/run, RAM).
RuntimeMaxUse=32M
# Poupar o eMMC: grava em lote a cada 5 min. Mensagens CRIT, ALERT e EMERG são
# gravadas na hora pelo próprio journald.
SyncIntervalSec=5m
# Teto por serviço contra rajadas (o agente já limita repetição por chave).
RateLimitIntervalSec=30s
RateLimitBurst=2000
# Sem rsyslog: não gravar em dobro.
ForwardToSyslog=no
