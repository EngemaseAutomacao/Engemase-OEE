# METABEGIN
# X-Env-Layer-Name: image-egw-gpt
# X-Env-Layer-Category: image
# X-Env-Layer-Desc: Layout de disco do gateway Engemase (docs/16 §4): GPT com
#  boot (FAT32) e root (ext4, tipo root-arm64). A partição data (/data) não
#  vai na imagem: o systemd-repart a cria no 1º boot com o resto do eMMC
#  (plano B: sfdisk no factory init). Partições referenciadas por
#  /dev/disk/by-slot/{boot,system,data}, só no dispositivo de boot.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: image-base,rpi-storage-binder
# X-Env-Layer-Provides: image
#
# X-Env-VarPrefix: image
#
# X-Env-Var-rootfs_type: ext4
# X-Env-Var-rootfs_type-Desc: Sistema de arquivos da raiz (só ext4).
# X-Env-Var-rootfs_type-Required: n
# X-Env-Var-rootfs_type-Valid: keywords:ext4
# X-Env-Var-rootfs_type-Set: y
# X-Env-Var-rootfs_type-Triggers:
#  when=IGconf_image_rootfs_type == 'ext4' set IGconf_fs_ext4_mkfs_args="-F -b ${IGconf_linux_page_size}" policy=lazy
#
# X-Env-Var-boot_part_size: 512M
# X-Env-Var-boot_part_size-Desc: Tamanho da partição boot (FAT32).
# X-Env-Var-boot_part_size-Required: n
# X-Env-Var-boot_part_size-Valid: size
# X-Env-Var-boot_part_size-Set: y
#
# X-Env-Var-root_part_size: 4096M
# X-Env-Var-root_part_size-Desc: Tamanho da partição root (ext4). Cabe o SO
#  (~1,2-1,8 GB, a medir) com folga para OTA e atualizações de segurança.
# X-Env-Var-root_part_size-Required: n
# X-Env-Var-root_part_size-Valid: size
# X-Env-Var-root_part_size-Set: y
#
# X-Env-Var-assetdir: ${DIRECTORY}
# X-Env-Var-assetdir-Desc: Diretório de recursos desta camada de imagem.
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - initramfs-tools
    - dosfstools
    - e2fsprogs
