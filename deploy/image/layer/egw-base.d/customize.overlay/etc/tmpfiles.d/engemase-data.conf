# Engemase: diretórios da partição /data (docs/16 §4). O systemd-repart já
# os cria no 1º boot (MakeDirectories=); aqui ficam dono e modo corretos.
d /data/identity 0755 root   root            -
d /data/oee      0750 oee    oee             -
d /data/journal  2755 root   systemd-journal -
d /data/localui  0700 oee-ui oee-ui          -
