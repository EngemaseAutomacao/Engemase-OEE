# Engemase: o NetworkManager só usa os perfis gerados (oee-it e oee-ot,
# amarrados pelo MAC). Nada de "Wired connection" automática em interface
# nova: um adaptador USB-Ethernet espetado por alguém não ganha IP.
[main]
plugins=keyfile
no-auto-default=*

[keyfile]
unmanaged-devices=except:type:ethernet

[connectivity]
enabled=false

[logging]
level=INFO
