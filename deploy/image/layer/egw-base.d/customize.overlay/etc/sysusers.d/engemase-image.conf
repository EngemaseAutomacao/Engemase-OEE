# Engemase: usuários dos serviços do gateway (docs/16 §4).
# O pacote oee-gateway pode declarar os mesmos em /usr/lib/sysusers.d; quem
# for lido primeiro cria e o resultado é igual. "tecnico" é criado pelo
# rpi-image-gen (device.user1).
g oee-admin -
u oee    - "Engemase OEE - agente de coleta"    /var/lib/oee-gateway /usr/sbin/nologin
u oee-ui - "Engemase OEE - pagina local"        /nonexistent         /usr/sbin/nologin
u oee-ra - "Engemase OEE - acesso remoto (F2)"  /nonexistent         /usr/sbin/nologin
m oee dialout
m oee gpio
m oee systemd-journal
