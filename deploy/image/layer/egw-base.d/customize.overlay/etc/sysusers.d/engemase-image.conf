# Engemase: usuários dos serviços do gateway (docs/16 §4), já na imagem para o
# nftables de fábrica ("oee") e o tmpfiles da /data (oee, oee-ui) funcionarem
# mesmo numa imagem de bancada sem o agente.
# O pacote oee-gateway declara os mesmos em /usr/lib/sysusers.d/oee-gateway.conf
# com os MESMOS campos (quem rodar primeiro cria; o resultado é igual) e põe o
# tecnico nos grupos oee-admin e systemd-journal. "tecnico" é criado pelo
# rpi-image-gen (device.user1) e não entra aqui.
g oee-admin -
u oee    - "Engemase OEE - agente de coleta"    /var/lib/oee-gateway /usr/sbin/nologin
u oee-ui - "Engemase OEE - pagina local"        /nonexistent         /usr/sbin/nologin
u oee-ra - "Engemase OEE - acesso remoto (F2)"  /nonexistent         /usr/sbin/nologin
m oee dialout
m oee gpio
m oee systemd-journal
