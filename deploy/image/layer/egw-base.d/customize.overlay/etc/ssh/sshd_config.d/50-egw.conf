# Engemase: o SSH fica MASCARADO no MVP (ssh.service e ssh.socket, docs/16 §7).
# Se for reativado na F2 (acesso remoto sob demanda, docs/12), estas regras já
# valem: só loopback, só chave/certificado, só o usuário "suporte".
ListenAddress 127.0.0.1
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers suporte
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
