# Engemase: cria a partição "data" no 1º boot, com todo o espaço livre do
# eMMC (docs/16 §4: boot, root e /data separadas). A imagem só traz boot e
# root; a raiz usa o tipo root-arm64 justamente para não casar com esta
# definição (linux-generic). Partições sem definição ficam intactas.
# Plano B (sem systemd-repart ou se falhar): o factory init usa sfdisk.
[Partition]
Type=linux-generic
Label=data
Format=ext4
MakeDirectories=/identity /oee /journal /localui
SizeMinBytes=2G
