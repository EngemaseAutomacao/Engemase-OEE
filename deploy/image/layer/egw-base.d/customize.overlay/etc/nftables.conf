#!/usr/sbin/nft -f
# /etc/nftables.conf - REGRAS DE FÁBRICA da imagem Engemase (docs/16 §5).
#
# Valem até o oee-helper gerar as regras definitivas a partir do
# /etc/oee-gateway/network.json (interfaces resolvidas pelo MAC, conjuntos
# ot_targets, DNS, NTP e proxy). Não dependem do nome das interfaces:
# - entrada: só DHCP, ICMP limitado e a página local (443) vinda do endereço
#   de serviço 169.254.0.0/16;
# - saída: DHCP, DNS, NTP, ICMP e HTTPS (443) só para os usuários oee
#   (agente) e _apt (atualizações). Nenhuma saída para CLPs: a OT só é
#   liberada quando houver dispositivos cadastrados;
# - sem encaminhamento (ip_forward=0 e chain forward em drop);
# - IPv6 descartado.

flush ruleset

table inet egw {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state invalid drop
		ct state established,related accept
		meta nfproto ipv6 drop
		udp sport 67 udp dport 68 accept
		ip saddr 169.254.0.0/16 tcp dport 443 accept
		icmp type echo-request limit rate 5/second accept
		limit rate 6/minute log prefix "egw-drop-in: " level info
		counter
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		limit rate 6/minute log prefix "egw-drop-fwd: " level warn
		counter
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oif "lo" accept
		ct state invalid drop
		ct state established,related accept
		meta nfproto ipv6 drop
		udp sport 68 udp dport 67 accept
		udp dport 53 accept
		tcp dport 53 accept
		udp dport 123 accept
		meta skuid { "oee", "_apt" } tcp dport 443 accept
		icmp type echo-request accept
		limit rate 6/minute log prefix "egw-drop-out: " level info
		counter
	}
}
