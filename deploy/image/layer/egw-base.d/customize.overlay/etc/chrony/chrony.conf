# Engemase: chrony de FÁBRICA. O oee-helper reescreve este arquivo a partir
# do /etc/oee-gateway/network.json (servidores NTP do cliente, docs/16 §4).
# NTP do DHCP (opção 42) entra por /run/chrony-dhcp (dispatcher do
# NetworkManager do pacote chrony; A CONFIRMAR na imagem).
confdir /etc/chrony/conf.d
sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d

# Reserva pública (consta na ficha de TI)
pool pool.ntp.br iburst maxsources 3

keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
maxupdateskew 100.0
leapsectz right/UTC

# Acerta de uma vez nos 3 primeiros ajustes (relógio errado após falta de energia)
makestep 1 3
# Mantém o RTC do R1000 (PCF8563W) acertado. A CONFIRMAR com o driver da Seeed.
rtcsync

# Não é servidor NTP e o chronyc só fala pelo socket Unix.
port 0
cmdport 0
