# Engemase: instalação das atualizações de SEGURANÇA entre 10h30 e 11h30
# (horário de Brasília), longe da janela padrão do OTA (22h-5h) e das trocas
# de turno usuais (6h, 14h, 22h). Sem reboot automático: "reinício pendente"
# vai no /sync e a plataforma agenda (F2).
[Timer]
OnCalendar=
OnCalendar=*-*-* 10:30:00 America/Sao_Paulo
RandomizedDelaySec=60min
AccuracySec=1min
Persistent=false
