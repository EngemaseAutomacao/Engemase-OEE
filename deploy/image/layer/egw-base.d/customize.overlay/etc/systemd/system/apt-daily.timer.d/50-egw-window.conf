# Engemase: janela do apt (download das listas) FORA da janela padrão do OTA
# (22h-5h no horário local, docs/rascunhos preparação §6.1). Evita disputa do
# dpkg com o oee-updater. Persistent=false: um gateway que ligar dentro da
# janela do OTA não dispara o apt atrasado.
# F2: o oee-helper reescreve com o fuso da unidade.
[Timer]
OnCalendar=
OnCalendar=*-*-* 09:30:00 America/Sao_Paulo
RandomizedDelaySec=30min
AccuracySec=1min
Persistent=false
