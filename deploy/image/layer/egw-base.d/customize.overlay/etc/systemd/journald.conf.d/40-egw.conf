# Engemase: journald persistente em /var/log/journal (bind de /data/journal),
# com limite de espaço para poupar o eMMC (docs/16 §7; rascunho de software §6.1).
# O pacote oee-gateway pode refinar em arquivo de número maior.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
MaxRetentionSec=30day
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=2000
ForwardToSyslog=no
ForwardToWall=no
